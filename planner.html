<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner</title><link rel="stylesheet" href="w.css"><style>
.card{padding:16px 18px}
.wrap{flex:1;min-height:0;display:flex;gap:16px}
.cal{flex:1;min-width:0;display:flex;flex-direction:column}
.side{width:32%;min-width:210px;max-width:300px;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:16px}
.nav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.nav b{font-size:15px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.ib{height:26px;min-width:26px;border:0;border-radius:8px;background:var(--chip);color:var(--ink);font:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:0 8px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:10px;font-weight:600;color:var(--mute);padding-bottom:5px}
.dow span{padding-left:8px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px 0 0 0}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:0}
.cell.out .dn{color:var(--dot)}
.dn{font-size:11px;font-weight:700;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;flex:none}
.cell.today .dn{background:var(--ink);color:var(--bg)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.over,.list.over{background:var(--chip)}
.chip{font-size:10.5px;font-weight:600;line-height:1.35;padding:2px 6px;border-radius:5px;background:var(--chip);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;flex:none}
.chip.p1{background:var(--ink);color:var(--bg)}
.chip.p3{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.chip.dn_{text-decoration:line-through;opacity:.45}
.more{font-size:10px;color:var(--mute);padding-left:4px;font-weight:600}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{border:0;border-radius:8px;background:var(--chip);color:var(--mute);font:inherit;font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg)}
.add{width:100%;font-size:12px;padding:8px 10px;border-radius:10px;margin-bottom:8px}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;border-radius:10px}
.it{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:600;cursor:grab;background:var(--bg);flex:none}
.it.dn_ .t{text-decoration:line-through;color:var(--mute)}
.ck{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--mute);background:transparent;padding:0;cursor:pointer}
.ck.on{background:var(--ink);border-color:var(--ink)}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{flex:none;border:0;font:inherit;font-size:9px;font-weight:800;border-radius:5px;padding:3px 6px;cursor:pointer;background:var(--chip);color:var(--mute)}
.pr.p1{background:var(--ink);color:var(--bg)}
.meta{font-size:10px;color:var(--mute);font-weight:600;flex:none}
@media (max-width:560px){.wrap{flex-direction:column;gap:10px}.side{width:auto;max-width:none;min-width:0;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px;flex:1}.cal{flex:1.3}}
</style></head><body><div class="card"><div class="wrap">
<div class="cal"><div class="nav"><b id="ttl"></b><button class="ib" id="tdy">Today</button><button class="ib" id="prev" aria-label="Previous month">‹</button><button class="ib" id="next" aria-label="Next month">›</button><button class="ib" id="bk" aria-label="Backup and restore">⋯</button></div>
<div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="grid" id="grid"></div></div>
<div class="side"><div class="tabs"><button class="tab" data-tab="inbox">Tasks</button><button class="tab" data-tab="today">Today</button><button class="tab" data-tab="done">Done</button></div>
<input class="add" id="add" maxlength="80" aria-label="New task"><div class="list" id="list"></div></div></div>
<div class="sheet" id="sheet"><div class="box"><h3>Edit task</h3><label>Title<input id="eT" maxlength="80"></label><label>Date<input type="date" id="eD"></label><label>Priority<select id="eP"><option value="1">High</option><option value="2">Mid</option><option value="3">Low</option></select></label><label>Course<select id="eC"></select></label>
<div class="rowb"><button class="btn ghost sm" id="eDel">Delete</button><button class="btn sm" id="eOk">Save</button></div></div></div>
<div class="sheet" id="sheet2"><div class="box"><h3>Backup</h3><div class="sub" id="bM">Copy this code and keep it somewhere safe. To restore, paste a code here and press Restore.</div><textarea id="bT" rows="5" spellcheck="false" aria-label="Backup code"></textarea>
<div class="rowb"><button class="btn ghost sm" id="bR">Restore</button><button class="btn sm" id="bC">Copy</button></div></div></div></div>
<script src="w.js"></script><script>
var $=W.$,T=W.get('tasks',[]),view=new Date(),sel=null,tab='inbox',cur=null,drag=null,PL=['','H','M','L'];view=new Date(view.getFullYear(),view.getMonth(),1);
function save(){W.set('tasks',T)}function td(){return W.iso(new Date())}function find(id){return T.filter(function(t){return t.id===id})[0]}
function sd(s){var d=W.day(s);return (d.getMonth()+1)+'/'+d.getDate()}
function chip(t){return '<div class="chip p'+t.p+(t.done?' dn_':'')+'" draggable="true" data-id="'+t.id+'" title="'+W.esc(t.t)+'">'+W.esc(t.t)+'</div>'}
function item(t){return '<div class="it'+(t.done?' dn_':'')+'" draggable="true" data-id="'+t.id+'"><button class="ck'+(t.done?' on':'')+'" data-ck="1" aria-label="Mark done"></button><span class="t">'+W.esc(t.t)+'</span>'+(t.d?'<span class="meta">'+sd(t.d)+'</span>':'')+'<button class="pr p'+t.p+'" data-pr="1" aria-label="Priority">'+PL[t.p]+'</button></div>'}
function render(){var y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),weeks=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7),h='',by={},today=td();
$('ttl').textContent=view.toLocaleDateString(W.lang,{month:'long',year:'numeric'});
T.forEach(function(t){if(t.d)(by[t.d]=by[t.d]||[]).push(t)});
for(var i=0;i<weeks*7;i++){var d=new Date(y,m,1-first.getDay()+i),k=W.iso(d),a=(by[k]||[]).sort(function(a,b){return a.done-b.done||a.p-b.p});
h+='<div class="cell'+(d.getMonth()!==m?' out':'')+(k===today?' today':'')+(k===sel?' sel':'')+'" data-d="'+k+'"><div class="dn">'+d.getDate()+'</div>'+a.slice(0,3).map(chip).join('')+(a.length>3?'<div class="more">+'+(a.length-3)+'</div>':'')+'</div>'}
$('grid').innerHTML=h;
var L,msg;if(tab==='inbox'){L=T.filter(function(t){return !t.d&&!t.done});msg='No unscheduled tasks.<br>Type above, then drag a task onto a date.'}
else if(tab==='today'){L=T.filter(function(t){return t.d&&t.d<=today&&!t.done}).sort(function(a,b){return a.p-b.p||(a.d<b.d?-1:1)});msg='Nothing due today.'}
else{L=T.filter(function(t){return t.done}).slice(-40).reverse();msg='Finished tasks show up here.'}
$('list').innerHTML=L.length?L.map(item).join(''):'<div class="empty">'+msg+'</div>';
[].forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('on',b.getAttribute('data-tab')===tab)});
$('add').placeholder=sel?'Add to '+sd(sel)+' — press Enter':(tab==='today'?'Add for today — press Enter':'Add a task — press Enter')}
function open(t){cur=t;$('eT').value=t.t;$('eD').value=t.d||'';$('eP').value=t.p;$('eC').innerHTML=W.opts(t.c);$('sheet').classList.add('on');$('eT').focus()}
function close(){$('sheet').classList.remove('on');cur=null}
$('list').onclick=function(e){var it=e.target.closest('.it');if(!it)return;var t=find(it.getAttribute('data-id'));if(!t)return;
if(e.target.getAttribute('data-ck')){t.done=!t.done;save();render()}else if(e.target.getAttribute('data-pr')){t.p=t.p%3+1;save();render()}else open(t)};
$('grid').onclick=function(e){var c=e.target.closest('.chip');if(c){var t=find(c.getAttribute('data-id'));if(t)open(t);return}
var cell=e.target.closest('.cell');if(!cell)return;var k=cell.getAttribute('data-d');sel=sel===k?null:k;render();if(sel)$('add').focus()};
$('add').onkeydown=function(e){if(e.isComposing||e.keyCode===229)return;if(e.key==='Escape'){sel=null;render();return}if(e.key!=='Enter')return;var v=this.value.trim();if(!v)return;
T.push({id:W.uid(),t:v,d:sel||(tab==='today'?td():null),p:2,c:'',done:false});if(tab==='done')tab='inbox';this.value='';save();render()};
document.querySelector('.tabs').onclick=function(e){var k=e.target.getAttribute('data-tab');if(k){tab=k;render()}};
$('prev').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$('next').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$('tdy').onclick=function(){var n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);render()};
document.addEventListener('dragstart',function(e){var el=e.target.closest&&e.target.closest('[data-id]');if(!el)return;drag=el.getAttribute('data-id');e.dataTransfer.setData('text/plain',drag);e.dataTransfer.effectAllowed='move'});
function clr(){[].forEach.call(document.querySelectorAll('.over'),function(x){x.classList.remove('over')})}
document.addEventListener('dragend',function(){drag=null;clr()});
$('grid').addEventListener('dragover',function(e){var c=e.target.closest('.cell');if(!c||!drag)return;e.preventDefault();if(!c.classList.contains('over')){clr();c.classList.add('over')}});
$('grid').addEventListener('drop',function(e){var c=e.target.closest('.cell'),t=find(drag);if(!c||!t)return;e.preventDefault();t.d=c.getAttribute('data-d');drag=null;save();render()});
$('list').addEventListener('dragover',function(e){if(!drag||tab==='done')return;e.preventDefault();clr();this.classList.add('over')});
$('list').addEventListener('drop',function(e){var t=find(drag);if(!t||tab==='done')return;e.preventDefault();t.d=tab==='today'?td():null;drag=null;save();clr();render()});
$('sheet').onclick=function(e){if(e.target===this)close()};
$('bk').onclick=function(){$('bT').value=JSON.stringify({tasks:T,courses:W.courses(),log:W.get('log',[])});$('sheet2').classList.add('on');$('bT').select()};
$('sheet2').onclick=function(e){if(e.target===this)this.classList.remove('on')};
$('bC').onclick=function(){$('bT').select();var ok=function(){$('bM').textContent='Copied. Paste it into a note to keep it.'};if(navigator.clipboard)navigator.clipboard.writeText($('bT').value).then(ok,function(){document.execCommand('copy');ok()});else{document.execCommand('copy');ok()}};
$('bR').onclick=function(){try{var o=JSON.parse($('bT').value);if(!Array.isArray(o.tasks))throw 0;T=o.tasks;save();if(Array.isArray(o.courses))W.set('courses',o.courses);if(Array.isArray(o.log))W.set('log',o.log);$('sheet2').classList.remove('on');render()}catch(e){$('bM').textContent='That code is not a valid backup. Nothing was changed.'}};
$('eOk').onclick=function(){if(!cur)return;var v=$('eT').value.trim();if(v)cur.t=v;cur.d=$('eD').value||null;cur.p=+$('eP').value;cur.c=$('eC').value;save();close();render()};
$('eDel').onclick=function(){if(!cur)return;var id=cur.id;T=T.filter(function(t){return t.id!==id});save();close();render()};
document.addEventListener('keydown',function(e){if(e.isComposing||e.keyCode===229)return;if(e.key==='Escape'){close();$('sheet2').classList.remove('on')}if(e.key==='Enter'&&cur&&e.target.id!=='add')$('eOk').click()});
W.on(function(k){if(k==='tasks'&&!cur)T=W.get('tasks',[]);if(!cur)render()});render();
</script></body></html>
