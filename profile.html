<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="w.css"><style>
.card{flex-direction:row;align-items:center;gap:min(5vw,22px)}
.av{flex:none;width:min(34vw,62vh);aspect-ratio:1;border-radius:50%;background:#fff;border:1px solid var(--line);overflow:hidden}
.av svg{display:block;width:100%;height:100%}
.tx{min-width:0;flex:1}
.nm{font-size:clamp(16px,5.2vw,24px);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.bio{margin-top:6px;font-size:12px;line-height:1.5;color:var(--mute);font-weight:500}
[contenteditable]{border-radius:6px;cursor:text}[contenteditable]:empty:before{content:attr(data-ph);color:var(--mute)}
@media (max-aspect-ratio:1/1){.card{flex-direction:column;justify-content:center;text-align:center}.av{width:min(52vw,40vh)}.tx{flex:none}}
</style></head><body><div class="card"><div class="av"><svg viewBox="40 30 432 432" role="img" aria-label="Profile illustration">

<div class="tx"><div class="nm" id="nm" contenteditable="plaintext-only" spellcheck="false" data-ph="Your name"></div><div class="bio" id="bio" contenteditable="plaintext-only" spellcheck="false" data-ph="One line about you"></div></div></div>
<script src="w.js"></script><script>
var $=W.$,p=W.get('profile',{n:W.q.get('name')||'Your name',b:W.q.get('bio')||'Click to edit · saved automatically'});
$('nm').textContent=p.n;$('bio').textContent=p.b;
function sv(){p={n:$('nm').textContent.trim(),b:$('bio').textContent.trim()};W.set('profile',p)}
['nm','bio'].forEach(function(i){$(i).oninput=sv;$(i).onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();this.blur()}}});
</script></body></html>
