<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes</title><link rel="stylesheet" href="w.css"><style>

.rt ul.todo li[data-done]{color:var(--mute);text-decoration:line-through}.rt ul.todo li[data-done]:before{background:var(--ink);border-color:var(--ink)}
.rt blockquote{margin:6px 0;padding:2px 0 2px 14px;border-left:3px solid var(--ink)}
.rt pre{margin:6px 0;background:var(--chip);border-radius:10px;padding:12px 14px;font:12px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.rt hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.rt .co{margin:6px 0;background:var(--chip);border-radius:12px;padding:12px 14px}
.rt mark{background:#fff1a8;color:inherit;border-radius:3px;padding:0 2px}.dark .rt mark{background:#6a5a12}

.rt img{display:block;max-width:100%;border-radius:10px;margin:8px 0}
.rt details{margin:4px 0}.rt summary{font-weight:700;cursor:pointer}.rt details>*:not(summary){margin-left:16px}
.rt table{border-collapse:collapse;margin:8px 0;width:100%;table-layout:fixed}.rt td,.rt th{border:1px solid var(--line);padding:6px 9px;vertical-align:top;font-size:12.5px}
.slm,.fb{position:absolute;z-index:6;display:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14)}

.slm button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:12px;font-weight:600;text-align:left;padding:7px 9px;border-radius:8px;cursor:pointer;flex:none}

.fb{align-items:center;gap:1px;padding:4px}
.fb button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:12px;font-weight:700;min-width:26px;height:26px;border-radius:7px;cursor:pointer;padding:0 6px}
.fb button:hover{background:var(--chip)}.fb .sep{width:1px;height:16px;background:var(--line);margin:0 3px}.fb input{width:200px;font-size:12px;padding:5px 8px}
@media (max-width:720px){.card{flex-direction:column}.rail{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:10px;gap:4px}.lb{display:none}.mid{width:auto;border-right:0;flex:1}.ed{display:none}.card.open .rail,.card.open .mid{display:none}.card.open .ed{display:flex}.back{display:inline-block}.eh{padding:14px 14px 8px}.body{padding:6px 14px 12px}.addb{padding:10px 14px 12px}.fr{grid-template-columns:74px minmax(0,1fr)}}
</style></head><body><div class="card" id="card">
